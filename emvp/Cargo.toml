[package]
name = "emvp"
version = "0.1.0"
edition = "2024"

[lib]
bench = false

[dependencies]
pollster = { version = "1", optional = true }
prime-field-layer = { path = "../prime-field-layer" }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
rayon = { workspace = true }
trapdoor-matrices = { path = "../trapdoor-matrices" }
wgpu = { version = "30", optional = true }

[dev-dependencies]
allocation-counter = { workspace = true }
bench-common = { path = "../prime-field-layer/benches/common" }
criterion = { workspace = true }
# Device-independent parse-and-validate test for the embedded answer WGSL
# (behind the `gpu` feature). Only the WGSL front end is pulled in; the
# shader the device compiles is the exact string this validates.
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
proptest = { workspace = true }
# Tests and benches build the shared deterministic Ring-LPN fixtures, which
# live behind the `test-utils` feature. The normal dependency above stays
# feature-free so library builds never compile the fixture builders.
trapdoor-matrices = { path = "../trapdoor-matrices", features = ["test-utils"] }

[features]
bench-quick = ["bench-common/quick"]
# Server-side GPU answer path. Everything the GPU touches is public
# (encrypted) protocol data, so this feature never affects client secrecy.
# `pollster` backs the genuinely blocking waits inside the synchronous API
# (adapter and device acquisition, error-scope pops), so it is an optional
# regular dependency rather than a dev-dependency.
gpu = ["dep:wgpu", "dep:pollster"]

[lints]
workspace = true

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "client_throughput"
harness = false

[[bench]]
name = "online"
harness = false

[[bench]]
name = "gpu"
harness = false
required-features = ["gpu"]

[[bench]]
name = "dispatch"
harness = false
required-features = ["gpu"]

[[bench]]
name = "answer_throughput"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_phase_sweep"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_online"
harness = false
required-features = ["gpu"]
