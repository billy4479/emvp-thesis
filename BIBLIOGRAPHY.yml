glibcmalloc:
  type: Misc
  title: "The GNU C Library Reference Manual: Malloc Tunable Parameters"
  author: "Free Software Foundation"
  organization: glibc
  date: 2024
  url: https://www.gnu.org/software/libc/manual/html_node/Malloc-Tunable-Parameters.html
  note: "Documents the dynamic `mmap` threshold and trim threshold behavior behind the reconstruction page-fault churn diagnosed in the throughput dip: per-call 512 KiB answer vectors below the rising threshold are served by fresh `mmap`/`munmap` and faulted per 4 KiB page under `madvise` huge pages. The `MALLOC_MMAP_THRESHOLD_` and `MALLOC_TRIM_THRESHOLD_` environment variables pinning that behavior define the tuned-allocator baseline the workspace APIs are measured against; the plan-reserve-execute workspaces make the pinning unnecessary by keeping answer storage heap-resident."

wgpu:
