    date: 2026-09-17
  serial-number: "v30.0.1"
  note: "Device abstraction backing `emvp`'s `gpu` feature (answer kernel dispatch, staging readback, packed multi-job flights). Its per-submit allocations (command encoders, bind groups, boxed map callbacks) and driver-side memory are outside the project's zero-allocation-after-reserve contract and are recorded separately by shape in the allocation measurements."

allocationcounter:
  type: Misc
  title: "allocation-counter: count and measure allocations in Rust tests"
  author: "Folkert de Vries"
  organization: fork-bombe
  date: 2026
  url:
    value: https://docs.rs/allocation-counter
    date: 2026-09-17
  serial-number: "v0.8.1"
  note: "Thread-local counting global allocator used to pin the zero-project-allocation guarantees: CPU batch execute, engine execute, codec decode/encode cycles, and the client verification kernel assert `count_total == 0` on warmed, reserved workspaces, and the GPU benches print per-case allocation spot checks. Counting is thread-local, so measured sections pin the calling thread (serial tiers) and rayon worker, wgpu-internal, and driver allocations are reported as unmeasured."
