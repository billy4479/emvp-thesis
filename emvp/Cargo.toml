[package]
name = "emvp"
version = "0.1.0"
edition = "2024"

[lib]
bench = false

[dependencies]
pollster = { version = "1", optional = true }
prime-field-layer = { path = "../prime-field-layer" }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
rayon = { workspace = true }
trapdoor-matrices = { path = "../trapdoor-matrices" }
wgpu = { version = "30", optional = true }

[dev-dependencies]
allocation-counter = { workspace = true }
bench-common = { path = "../prime-field-layer/benches/common" }
criterion = { workspace = true }
proptest = { workspace = true }

[features]
bench-quick = ["bench-common/quick"]
# Server-side GPU answer path. Everything the GPU touches is public
# (encrypted) protocol data, so this feature never affects client secrecy.
# `pollster` backs the blocking `_sync` wrappers, which are library API, so
# it is an optional regular dependency rather than a dev-dependency.
gpu = ["dep:wgpu", "dep:pollster"]

[lints]
workspace = true

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "gpu"
harness = false
required-features = ["gpu"]

[[bench]]
name = "dispatch"
harness = false
required-features = ["gpu"]
