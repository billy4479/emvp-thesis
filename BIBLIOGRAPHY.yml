shoup2009:
  type: Book
  title: "A Computational Introduction to Number Theory and Algebra"
  author: "Shoup, Victor"
  date: 2009
  edition: '2'
  publisher: Cambridge University Press
  url: https://shoup.net/ntb/
  note: "Attributed origin of 'Shoup's trick' (precomputing floor(b * 2^k / p) so a modular product costs one widening multiply, one multiply-high and one subtraction, with no division), as distributed in Shoup's NTL library. `prime-field-layer` uses it for twiddle factors (`NttPlan` twiddle storage), the scalar-multiply bulk kernel (`PrimeField::scalar_mul_assign_canonical`), and, in the wide-input lazy form, the transform butterflies. Harvey 2014 restates the correctness bounds for NTT butterflies and Bradbury et al. 2021 give the precise 32-bit-lane bound."

crandall1992:
  type: Patent
  title: "Method and apparatus for public key exchange in a cryptographic system"
  author: "Crandall, Richard E."
  date: 1992
  serial-number: "US Patent 5,159,632"
  note: "Origin of pseudo-Mersenne primes (p = 2^w - c with tiny c) and the high-half folding reduction ab = a_h * 2^w + a_l -> a_h * c + a_l. `prime-field-layer` applies the 32-bit case, 2^32 = 5 (mod 2^32 - 5), in `dot_pseudo_mersenne_32` with chunked low/high accumulators to stay overflow-free; Bernstein 2006 (Curve25519) later popularized the technique in academic literature."

frigo1999:
