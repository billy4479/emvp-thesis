harvey2014:
  type: Article
  title: Faster arithmetic for number-theoretic transforms
  author: "Harvey, David"
  date: 2014
  page-range: 113-119
  serial-number:
    doi: 10.1016/j.jsc.2013.09.002
  note: "Used for the Shoup multiplication bounds and the redundant-representation lazy NTT butterflies in `prime-field-layer`: the forward Cooley-Tukey butterfly follows section 4, Algorithm 4 (residues in `[0, 4p)`, one conditional halving of the `X` input), and the inverse Gentleman-Sande butterfly follows section 3, Algorithm 3 (residues in `[0, 2p)`, one conditional halving of the sum, the `+2p`-planted difference fed unreduced into the multiplication). Also the paper's observation that Shoup's multiplication needs no correction for any input below the word size; its precise 32-bit-lane bound is restated and proved in the `shoup_mul_lazy_for` comments in `src/ntt/support.rs`."
  parent:
    type: Periodical
    title: Journal of Symbolic Computation
    volume: 60

bradbury2021:
  type: Misc
  title: NTT software optimization using an extended Harvey butterfly
  author: ["Bradbury, Jonathan", "Drucker, Nir", "Hillenbrand, Marius"]
  date: 2021
  serial-number: "IACR ePrint 2021/1396"
  url: https://eprint.iacr.org/2021/1396
  note: Theorem 2 analyzes the wide-input lazy Shoup product on 32-bit SIMD lanes with planted offsets in the multiplicand, the setting of the `shoup_mul_lazy_for` kernels in `prime-field-layer/src/ntt/support.rs` (the bound is derived independently in those comments). Its uncorrected product in `[0, 2p)` with the same quotient estimate on canonical inputs backs the reduced Shoup kernel for `2^30 <= p < 2^31`, where one correction keeps every butterfly input and output in `[0, p)`.

longa2016:
  type: Article
  title: Speeding up the Number Theoretic Transform for Faster Ideal Lattice-Based Cryptography
  author: ["Longa, Patrick", "Naehrig, Michael"]
  date: 2016
  page-range: 124-139
  serial-number:
    doi: 10.1007/978-3-319-48965-0_8
  parent:
    type: Proceedings
    title: "Cryptology and Network Security (15th International Conference, CANS 2016), LNCS 10052"
  note: "Origin customarily cited for the fused negacyclic NTT of NewHope-style implementations: with psi a primitive 2N-th root of unity and omega = psi^2, a product modulo x^N + 1 is evaluation-interpolation at the odd powers psi^(2i+1), and the identity a(psi^(2i+1)) = sum_j a_j psi^j omega^(ij) shows the negacyclic spectrum is a plain cyclic NTT of the twisted input. Longa-Naehrig absorb that twist into the per-stage twiddle tables (storing combined omega^e psi^f constants built once at plan construction), so forward and inverse butterflies map directly between coefficients and the negacyclic spectrum with the same multiplication count as the cyclic transform, and the three separate twist/untwist passes disappear. `prime-field-layer` uses the unfused folklore scheme instead (von zur Gathen-Gerhard, ch. 8): `NegacyclicPlan::convolution` in `prime-field-layer/src/ntt/convolution.rs` scales both operands by psi powers and unscales the result, paying 3N extra field multiplications per product against (N/2) log_2 N butterfly products plus N pointwise products."

